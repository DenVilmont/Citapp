name: Deploy Admin
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/Citapp.Admin -c Release -o publish
      - name: Write runtime config
        run: |
          cat > publish/wwwroot/appsettings.runtime.json <<'JSON'
          {
            "Supabase": {
              "Url": "${{ vars.SUPABASE_URL }}",
              "AnonKey": "${{ vars.SUPABASE_ANON_KEY }}",
              "ServiceMediaBucket": "${{ vars.SUPABASE_SERVICE_MEDIA_BUCKET }}"
            },
            "BotApi": {
              "BaseUrl": "${{ vars.BOTAPI_BASE_URL }}"
            }
          }
          JSON
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
